<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=492,user-scalable=no">
<title>재생목록</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#202225;color:#f2f0ed;font:20px/1.25 Roboto,"Malgun Gothic",sans-serif}
main{height:100%;border:1px solid #4e5054;padding:14px 18px}
header,.transport{display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px;margin:0}
button{border:0;border-radius:5px;color:inherit;background:#303337;font:inherit;min-height:44px;padding:0 14px}
button:active{background:#485052}
.track{padding:13px 0 12px;border-bottom:1px solid #45484c}
.track strong,.track span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track span{font-size:18px;color:#bdc8d2;margin-top:2px}
.transport{margin-top:14px}
.transport button{margin-right:8px;flex:1}
.transport button:last-child{margin-right:0}
#open-player{display:block;width:100%;margin-top:11px;text-align:left}
</style>
<main>
  <header><h1>재생목록</h1><button id="close" type="button" aria-label="닫기">×</button></header>
  <div class="track"><strong id="track-title">재생 정보 없음</strong><span id="track-sub">현재 재생</span></div>
  <div class="transport">
    <button id="previous" type="button">이전 곡</button>
    <button id="play" type="button">재생</button>
    <button id="next" type="button">다음 곡</button>
  </div>
  <button id="open-player" type="button">순정 미디어 열기</button>
</main>
<script>
(function () {
  var actions = {close:'playlist-close',previous:'previous',play:'play',next:'next','open-player':'media-player'};
  Object.keys(actions).forEach(function (id) {
    document.getElementById(id).onclick = function () {
      if (window.K8NavBar) window.K8NavBar.action(actions[id]);
    };
  });
  window.K8Playback = {
    update: function (title, artist, playing, source, settings) {
      document.getElementById('track-title').textContent = title || '재생 정보 없음';
      document.getElementById('track-sub').textContent = [artist, settings].filter(Boolean).join(' · ') || '현재 재생';
      document.getElementById('play').textContent = playing ? '일시정지' : '재생';
      document.getElementById('open-player').textContent = source === 'bt' ? '순정 블루투스 오디오 열기'
        : source === 'usb' ? '순정 USB 음악 열기'
        : source === 'nature' ? '순정 자연의 소리 열기'
        : ['radio','fm','am'].indexOf(source) >= 0 ? '순정 라디오 열기' : '순정 미디어 열기';
    }
  };
}());
</script>
</html>
<script>window.K8_MARQUEE = '.track strong, .track span';</script>
<script src="marquee.js"></script>
