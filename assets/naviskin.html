<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>K8 분할화면 손잡이</title>
<style>
/* 0.5.0-test58: ccNC 분할화면 손잡이(지도 오른쪽의 짧은 세로선, ccNC 실차 영상·설명서 D-map_guidance).
   화면 오른쪽 끝에 있고, 왼쪽으로 밀거나 누르면 순정 분할화면을 연다. 분할이 열리면 창이 내려간다(닫기는 순정 분할 칸에서). 창은 1920×720 기준 60×220, fit()이 실제 크기로 맞춘다. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 60px; height: 220px; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
#line { position: absolute; left: 27px; top: 50px; width: 6px; height: 120px; border-radius: 3px;
  background: #8c8c8c; box-shadow: 0 0 0 1px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.35); }
#stage.down #line { background: #2fae9c; }
</style>
</head>
<body>
<div id="stage"><span id="line"></span></div>
<script>
(function () {
  var stage = document.getElementById('stage'), startX = null;
  function fit() {
    var s = (window.innerWidth || 60) / 60;
    stage.style.webkitTransform = stage.style.transform = 'scale(' + s + ')';
  }
  function send(action) { if (window.K8NavBar) window.K8NavBar.action(action); }
  document.addEventListener('touchstart', function (e) {
    startX = e.touches[0].screenX; stage.className = 'down';
  }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);   // Chrome 30: 막지 않으면 스크롤로 가져감
  document.addEventListener('touchend', function (e) {
    stage.className = '';
    if (startX === null) return;
    var dx = e.changedTouches[0].screenX - startX, min = 24 * (window.innerWidth || 60) / 60;
    startX = null;
    if (dx <= min) send('split-open');   // 오른쪽으로 민 것만 무시
  }, false);
  document.addEventListener('touchcancel', function () { startX = null; stage.className = ''; }, false);
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
