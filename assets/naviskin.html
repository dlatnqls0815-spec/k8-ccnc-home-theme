<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>K8 분할화면 손잡이</title>
<style>
/* 0.5.0-test59: ccNC 분할화면 손잡이(지도 오른쪽 끝에 붙은 짧은 세로선). 순정 회색 손잡이는 NavBarService 가 가리고,
   누르기·밀기도 NavBarService 가 창에서 직접 읽는다(닫힘: 누르거나 왼쪽으로 밀면 열림, 열림: 누르거나 오른쪽으로 밀면 닫힘).
   창은 1920×720 기준 60×220, fit()이 실제 크기로 맞춘다. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 60px; height: 220px; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
#line { position: absolute; left: 54px; top: 50px; width: 6px; height: 120px; border-radius: 3px 0 0 3px;
  background: #8c8c8c; box-shadow: 0 0 0 1px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.35); }
#stage.down #line { background: #2fae9c; }
</style>
</head>
<body>
<div id="stage"><span id="line"></span></div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = (window.innerWidth || 60) / 60;
    stage.style.webkitTransform = stage.style.transform = 'scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
