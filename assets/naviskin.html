<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>K8 내비 왼쪽 버튼</title>
<style>
/* 순정 5W 내비 왼쪽 버튼 줄 위에 얹는 ccNC 모양 덮개. 창은 터치를 받지 않아 누르면 아래 순정 버튼이 동작한다.
   좌표는 1920×720 기준. 창은 왼쪽 위 140×632(하단바 위)를 덮고 fit()이 실제 크기로 줄인다.
   ccNC 모양은 설명서 D-map_guidance.png 실측: 버튼 102×102, 모서리 3px, 낮 배경 #e5e1dc·아이콘 #646462,
   돋보기 45×40, "Nav" 22px, 스피커 40×31. */
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage {
  position: absolute; left: 0; top: 0; width: 140px; height: 632px;
  -webkit-transform-origin: 0 0; transform-origin: 0 0;
  font: 500 22px/1 Roboto, "Malgun Gothic", sans-serif;
}
.skin {
  position: absolute; left: 6px; width: 102px; height: 102px; border-radius: 3px;
  background: #2f3033; color: #dcdcdc;
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.day .skin { background: #e5e1dc; color: #646462; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.skin svg { position: absolute; display: block; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.skin .label { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 24px; font-weight: 600; letter-spacing: -.2px; }
.skin .solid { fill: currentColor; stroke: none; }
/* 맞춤 확인용(?outline): 순정 버튼 자리 테두리만 */
.outline .skin { background: none; box-shadow: none; border: 2px solid #ff2d55; }
.outline .skin svg, .outline .skin .label { opacity: .5; }
</style>
</head>
<body>
<div id="stage">
  <!-- 순정 5W 순서: 0 홈, 1 나침반(순정 그대로), 2 Nav 음성, 3 확대, 4 Auto 축척(순정 그대로), 5 축소 -->
  <div class="skin" data-slot="0" aria-label="홈">
    <svg style="left:32px;top:33px;width:38px;height:36px" viewBox="0 0 38 36"><path d="M2 16 19 2l17 14M7 12v22h24V12" stroke-width="2.4"/></svg>
  </div>
  <div class="skin" data-slot="2" aria-label="안내 음성">
    <div class="label">Nav</div>
    <svg style="left:31px;top:48px;width:40px;height:31px" viewBox="0 0 40 31">
      <path class="solid" d="M1 9h9L22 0v31L10 22H1z"/>
      <g id="nav-waves"><path d="M27 10a8 8 0 0 1 0 11" stroke-width="2.8"/><path d="M32.5 5a15 15 0 0 1 0 21" stroke-width="2.8"/></g>
      <g id="nav-muted" hidden><path d="M27 9.5l11 12M38 9.5l-11 12" stroke-width="2.8"/></g>
    </svg>
  </div>
  <div class="skin" data-slot="3" aria-label="확대">
    <svg style="left:33px;top:33px;width:36px;height:36px" viewBox="0 0 36 36"><path d="M18 2v32M2 18h32" stroke-width="2.6"/></svg>
  </div>
  <div class="skin" data-slot="5" aria-label="축소">
    <svg style="left:33px;top:33px;width:36px;height:36px" viewBox="0 0 36 36"><path d="M2 18h32" stroke-width="2.6"/></svg>
  </div>
</div>
<script>
  // 순정 5W 버튼 자리(1920 기준). 차 사진에서 잰 추정값: 맨 위 6px, 간격 107px, 순정 버튼보다 2px씩 크게 덮는다.
  // 실차 화면 캡처를 받으면 이 두 숫자만 고친다.
  var SLOT_TOP = 6, SLOT_PITCH = 107;
  var skins = document.querySelectorAll('.skin');
  for (var i = 0; i < skins.length; i++) {
    skins[i].style.top = (SLOT_TOP + SLOT_PITCH * Number(skins[i].getAttribute('data-slot'))) + 'px';
  }
  if (/[?&]outline\b/.test(location.search)) document.body.className += ' outline';
  function fit() {
    var scale = document.documentElement.clientWidth / 140;
    var stage = document.getElementById('stage');
    stage.style.webkitTransform = 'scale(' + scale + ')';
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  window.K8NaviSkin = {
    // night: 내비 DAYNIGHT_CHANGED(true = 밤), muted: VIT_NOTI_NAVI_MUTE_STATE(true = 음소거)
    state: function (night, muted) {
      document.getElementById('stage').className = night ? '' : 'day';
      document.getElementById('nav-waves').style.display = muted ? 'none' : '';
      if (muted) document.getElementById('nav-muted').removeAttribute('hidden');
      else document.getElementById('nav-muted').setAttribute('hidden', '');
    }
  };
</script>
</body>
</html>
