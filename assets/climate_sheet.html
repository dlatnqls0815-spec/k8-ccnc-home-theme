<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage'), sheet = document.getElementById('sheet'), dim = document.getElementById('dim');
  var st = {}, closing = false, lastJson = null;
  var RECIRC = '<svg width="50" height="50" viewBox="0 0 24 24"><path fill="#eef1f4" d="m9.25 15l1.05-1.05l-.675-.7h2q1.2 0 2.038-.837t.837-2.038t-.837-2.037t-2.038-.838H7.25V9h4.375q.575 0 .975.4t.4.975t-.4.975t-.975.4h-2l.675-.675L9.25 10l-2.5 2.5zM6.5 20q-1.025 0-1.875-.537T3.35 18H0v-6q0-.825.588-1.412T2 10h1l1.5-4.175q.225-.6.738-.962T6.4 4.5h7.45q.525 0 .988.263t.737.712L18 9.5l4.175.35q.825.075 1.325.625t.5 1.375V18h-3.35q-.425.925-1.275 1.463T17.5 20t-1.875-.537T14.35 18h-4.7q-.425.925-1.275 1.463T6.5 20m0-2q.625 0 1.063-.437T8 16.5V16h8v.5q0 .625.438 1.063T17.5 18t1.063-.437T19 16.5V16h3v-4.15l-5.2-.45l-2.925-4.9H6.4l-2 5.5H2v4h3v.5q0 .625.438 1.063T6.5 18m5.5-5.75"/></svg>';  // Google Material Symbols car_fan_recirculate_2 (Apache 2.0)
  var FRESH = '<svg width="50" height="50" viewBox="0 0 24 24"><path fill="#eef1f4" d="M6.5 20q-1.025 0-1.875-.537T3.35 18H0v-6q0-.825.588-1.412T2 10h1l1.5-4.175q.225-.6.738-.962T6.4 4.5h7.45q.525 0 .988.263t.737.712l.85 1.4l-1.375 1.6L13.875 6.5H6.4l-2 5.5H2v4h3v.5q0 .625.438 1.063T6.5 18t1.063-.437T8 16.5V16h8v.5q0 .625.438 1.063T17.5 18t1.063-.437T19 16.5V16h3v-4.15l-3.65-.325l1.6-1.85l2.225.175q.825.075 1.325.625t.5 1.375V18h-3.35q-.425.925-1.275 1.463T17.5 20t-1.875-.537T14.35 18h-4.7q-.425.925-1.275 1.463T6.5 20m3.5-5.5l1.05-1.05l-.675-.7h4.95L21.55 5.5l-1.125-1l-5.775 6.75h-4.275l.675-.7L10 9.5L7.5 12z"/></svg>';  // Google Material Symbols car_fan_recirculate (Apache 2.0)
  function send(action, value) { if (window.K8Climate) window.K8Climate.action(action, value || 0); }
  function fit() { var s = (window.innerWidth || 1920) / 1920; stage.style.webkitTransform = stage.style.transform = 'scale(' + s + ')';
    stage.style.top = ((window.innerHeight || 720) - 720 * s) + 'px'; }
  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function close() {
    if (closing) return;
    closing = true;
    sheet.style.webkitTransition = sheet.style.transition = '';
    sheet.style.webkitTransform = sheet.style.transform = '';
    sheet.className = '';
    dim.className = '';
    setTimeout(function () { send('close'); }, 330);
  }
  // 옵션: 0 없음, 1·2 열선, 3·4 통풍, 5·6 둘 다. -1(순정이 모름)은 화면 조작이 없는 차라 숨긴다(K8 앞좌석은 물리 버튼만, 2026-11-27).
  function hasHeat(o) { return o === 1 || o === 2 || o === 5 || o === 6; }
  function hasVent(o) { return o === 3 || o === 4 || o === 5 || o === 6; }
  function level(s, heat) { return heat ? (s >= 6 && s <= 8 ? s - 5 : 0) : (s >= 3 && s <= 5 ? s - 2 : 0); }
  function bars(b, n) { var i = b.querySelectorAll('.lv i'); for (var k = 0; k < i.length; k++) i[k].className = k < n ? 'on' : ''; }
  function temp(v, unit) { if (typeof v !== 'number') return '--'; return (unit === 1 ? Math.round(v * 9 / 5 + 32) : v.toFixed(1)) + '<small>°</small>'; }
  function render() {
    all('[data-seat]').forEach(function (b) {
      var seat = b.getAttribute('data-seat'), heat = b.getAttribute('data-kind') === 'heat';
      var opt = typeof st[seat + 'Opt'] === 'number' ? st[seat + 'Opt'] : -1, s = typeof st[seat] === 'number' ? st[seat] : -1;
      b.hidden = heat ? !hasHeat(opt) : !hasVent(opt);
      var n = level(s, heat);
      b.className = 'b' + (n ? (heat ? ' heat' : ' vent') : '');
      bars(b, n);
    });
    var wheel = document.getElementById('wheel');
    wheel.hidden = !(st.swOpt > 0);
    var won = st.wheelState === 1 || st.swStep2 === 1 || st.swStep1 === 1;
    wheel.className = 'b' + (won ? ' heat' : '');
    bars(wheel, won ? 1 : 0);
    // 위 줄: 칸마다 보이는 버튼만. 다섯 칸이 다 있으면 원래 자리, 빠진 칸이 있으면(예: K8 앞좌석·핸들은 화면 조작 없음)
    // 남은 칸만 팝업 가운데(888)에 모으고 칸 이름·구분선도 맞춘다.
    var ORDER = ['drv', 'rl', 'wheel', 'rr', 'ast'];
    var FIXED = { drv: [60, 352], rl: [457, 312], wheel: [813, 150], rr: [1007, 312], ast: [1364, 352] };
    var groups = ORDER.map(function (g) {
      var btns = g === 'wheel' ? [wheel] : all('[data-seat="' + g + '"]');
      return { g: g, shown: btns.filter(function (b) { return !b.hidden; }) };
    });
    var full = groups.every(function (x) { return x.shown.length; });
    var place = function (x, left, width) {
      var label = document.querySelector('[data-g="' + x.g + '"]');
      label.hidden = !x.shown.length;
      if (!x.shown.length) return;
      label.style.left = left + 'px';
      label.style.width = width + 'px';
      var bw = parseInt(x.shown[0].style.width, 10);
      if (x.shown.length === 1) x.shown[0].style.left = (left + (width - bw) / 2) + 'px';
      else { x.shown[0].style.left = left + 'px'; x.shown[1].style.left = (left + width - bw) + 'px'; }
    };
    all('[data-sep]').forEach(function (d) { d.hidden = !full; });
    if (full) groups.forEach(function (x) { place(x, FIXED[x.g][0], FIXED[x.g][1]); });
    else {
      var live = groups.filter(function (x) { return x.shown.length; });
      var widths = live.map(function (x) {
        var bw = parseInt(x.shown[0].style.width, 10);
        return Math.max(x.g === 'wheel' ? 150 : 312, x.shown.length * bw + (x.shown.length - 1) * 12);
      });
      var total = widths.reduce(function (t, w) { return t + w; }, 0) + Math.max(0, live.length - 1) * 80;
      var left = 888 - total / 2;
      groups.forEach(function (x) { if (!x.shown.length) place(x, 0, 0); });
      live.forEach(function (x, i) { place(x, left, widths[i]); left += widths[i] + 80; });
    }
    var c = st.climate || {};
    document.getElementById('tdr').innerHTML = temp(c.driver, c.unit);
    document.getElementById('tps').innerHTML = temp(c.passenger, c.unit);
    document.getElementById('fanv').textContent = typeof c.blower === 'number' ? String(c.blower) : '-';
    var on = { auto: c.auto === 1, ac: c.ac === 1, sync: st.sync === 1, defog: st.defog === 1, intake: c.intake === 1, aircln: st.airClean === 1, off: c.power === 0 };
    all('[data-tog]').forEach(function (b) { b.className = (b.getAttribute('data-cls') || 'c') + (on[b.getAttribute('data-tog')] ? ' on' : ''); });
    // 바람 방향: 순정 BLOWER_MODE 1 정면, 2 정면+발, 3 발, 4 발+앞유리
    // AUTO 바람 3단계: 순정 MltAutoBlrTxt 2·3·4(누를 때마다 2→4→3→2, 2026-11-27 차) → 막대 1~3
    var step = c.auto === 1 && c.autoText >= 2 && c.autoText <= 4 ? c.autoText - 1 : 0;
    all('.pa .st i').forEach(function (b, k) { b.className = k < step ? 'on' : ''; });
    // 지금 방향 그림만 보인다(모르면 정면 그림)
    var cur = c.mode >= 1 && c.mode <= 4 ? c.mode : 1;
    all('#mode svg').forEach(function (g) { g.setAttribute('class', +g.getAttribute('data-icon') === cur ? 'cur' : ''); });
    // 내기(차 안에서 도는 화살표) / 외기(밖에서 들어오는 화살표) — 표준 공조 기호 모양을 직접 그림
    // 공기청정기가 있는 차에서만 공기청정 단추를 보이고, 아래 줄 단추는 보이는 것만 가운데(888) 기준으로 늘어놓는다
    document.querySelector('[data-tog="aircln"]').hidden = st.purifier !== 1;
    var chips = all('[data-tog]').filter(function (b) { return !b.hidden && !b.getAttribute('data-cls'); });
    var cx = 888 - (chips.length * 136 + (chips.length - 1) * 12) / 2;
    chips.forEach(function (b, i) { b.style.left = (cx + i * 148) + 'px'; });
    document.getElementById('intakeIcon').innerHTML = c.intake === 1 ? RECIRC : FRESH;
    var noControl = st.frontControl === 0;
    all('[data-tog], [data-temp], [data-fan], #mode').forEach(function (b) { b.disabled = noControl; });
    document.body.className = noControl ? 'nocontrol' : '';
    var note = document.getElementById('note');
    note.hidden = !noControl;
    note.textContent = noControl ? '이 차는 화면에서 공조를 바꾸는 기능을 지원하지 않습니다.' : '';
  }
  all('[data-seat]').forEach(function (b) {
    b.onclick = function () { var seat = b.getAttribute('data-seat'); send('seat-' + seat + '-' + b.getAttribute('data-kind'), typeof st[seat] === 'number' ? st[seat] : 2); };
  });
  document.getElementById('wheel').onclick = function () { send('wheel'); };
  all('[data-tog]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-tog'), c = st.climate || {};
      var cur = k === 'auto' ? c.auto : k === 'ac' ? c.ac : k === 'intake' ? c.intake : k === 'sync' ? st.sync : k === 'defog' ? st.defog : k === 'aircln' ? st.airClean : 0;
      send(k, cur === 1 ? 1 : 0);
    };
  });
  // 바람 방향 한 버튼: 정면 → 정면+발 → 발 → 발+앞유리 → 정면
  document.getElementById('mode').onclick = function () {
    var m = (st.climate || {}).mode;
    send('mode', m >= 1 && m < 4 ? m + 1 : 1);
  };
  all('[data-temp]').forEach(function (b) { b.onclick = function () { send(b.getAttribute('data-temp'), +b.getAttribute('data-dir')); }; });
  all('[data-fan]').forEach(function (b) {
    b.onclick = function () {
      var cur = (st.climate || {}).blower;
      var next = Math.max(1, Math.min(8, (typeof cur === 'number' ? cur : 0) + (+b.getAttribute('data-fan'))));
      send('fan', next);
    };
  });
  dim.onclick = close;
  // 아래로 끌어 닫기: 손가락을 따라 내려가고 120px 넘게 내리면 닫힘
  var y0 = null, dy = 0, SLIDE = '-webkit-transform .34s cubic-bezier(.2,.8,.25,1)';
  function move(y) { sheet.style.webkitTransform = sheet.style.transform = y === null ? '' : 'translate3d(0,' + y + 'px,0)'; }
  sheet.addEventListener('touchstart', function (e) { if (!closing) { y0 = e.touches[0].screenY; dy = 0; } }, false);
  sheet.addEventListener('touchmove', function (e) {
    if (y0 === null) return;
    dy = Math.max(0, (e.touches[0].screenY - y0) / ((window.innerWidth || 1920) / 1920));
    if (dy > 12) { e.preventDefault(); sheet.style.webkitTransition = 'none'; move(dy); }
  }, false);
  function end() {
    if (y0 === null) return;
    y0 = null;
    sheet.style.webkitTransition = SLIDE;
    if (dy > 120) close(); else move(null);
  }
  sheet.addEventListener('touchend', end, false);
  sheet.addEventListener('touchcancel', end, false);
  window.K8Sheet = {
    // 0.7초마다 같은 값이 오면 다시 그리지 않는다(구형 WebView 에서 매번 다시 배치·그리기를 막는다)
    state: function (json) { if (json === lastJson) return; lastJson = json; try { st = JSON.parse(json) || {}; } catch (e) { st = {}; } render(); },
    close: close
  };
  fit();
  window.addEventListener('resize', fit);
  render();
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    setTimeout(function () { sheet.className = 'open'; dim.className = 'on'; }, 60);
  }); });
})();
