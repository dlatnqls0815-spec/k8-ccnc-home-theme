<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K8 홈 · 하단바 예시안</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #0c121b; color: #f4f8ff; font: 16px/1.4 "Malgun Gothic", Roboto, sans-serif; }
button { border: 0; color: inherit; background: none; font: inherit; cursor: pointer; }
button:focus { outline: 2px solid #b9e5fa; outline-offset: -3px; }
button:active { opacity: .75; }
h1, h2, p { margin: 0; }
.shell { position: relative; min-height: 360px; height: 100%; padding: 0 2.5%; }
.top, .dock { position: absolute; left: 2.5%; right: 2.5%; height: 12%; }
.top { top: 0; display: table; width: 95%; }
.top h1, .top time { display: table-cell; vertical-align: middle; }
.top h1 { font-size: 24px; font-size: 1.65vw; font-weight: 700; }
.top h1 b { margin-right: 14px; color: #a9dcf6; }
.top time { text-align: right; font-size: 20px; font-size: 1.47vw; }
.deck { position: absolute; top: 12%; right: 2.5%; bottom: 14%; left: 2.5%; }
.row { position: relative; height: 100%; }
.card { position: absolute; top: 0; bottom: 0; display: grid; grid-template-rows: 72% 28%; overflow: hidden; border-radius: 12px; background: #182330; }
.map { left: 0; width: 51%; background: #18324a; }
.media { left: 52%; width: 27%; background: #263f40; }
.phone { left: 80%; width: 20%; background: #35394b; }
.art { position: absolute; top: 0; right: 0; bottom: 28%; left: 0; overflow: hidden; }
.art > canvas { position: absolute; width: 100%; height: 100%; }
.art-note { position: absolute; left: 5%; bottom: 8%; color: #e1f3ff; font-size: 18px; font-size: 1.1vw; }
.caption { grid-row: 2; background: #141d28; }
.caption button { width: 100%; height: 100%; padding: 0 8%; text-align: left; }
.caption button::after { content: ""; position: absolute; inset: 0; }
.caption button:focus { outline: none; }
.caption button:focus-visible::after { outline: 2px solid #b9e5fa; outline-offset: -3px; border-radius: 12px; }
.map .caption button { padding: 0 4%; }
.caption strong, .caption span { display: block; }
.caption strong { font-size: 22px; font-size: 1.5vw; }
.caption span { margin-top: 3px; color: #c5d0de; font-size: 15px; font-size: 1vw; }
.caption .arrow { float: right; font-size: 1.8em; line-height: 1; color: #afd9eb; }
.apps .card { width: 15.833%; }
.apps .card:nth-child(1) { left: 0; background: #1e3a50; }
.apps .card:nth-child(2) { left: 16.833%; background: #274243; }
.apps .card:nth-child(3) { left: 33.666%; background: #35394b; }
.apps .card:nth-child(4) { left: 50.499%; background: #443a34; }
.apps .card:nth-child(5) { left: 67.332%; background: #323f53; }
.apps .card:nth-child(6) { left: 84.165%; background: #343940; }
.dock { bottom: 0; display: table; width: 95%; }
.dock > div { display: table-cell; vertical-align: middle; width: 33.33%; white-space: nowrap; }
.dock > div:nth-child(2) { text-align: center; }
.dock > div:last-child { text-align: right; }
.dock button { min-height: 44px; padding: 0 16px; color: #bfcad8; font-size: 16px; font-size: 1.05vw; border-radius: 6px; }
.dock button[aria-pressed="true"] { background: #253447; color: #fff; }
.notice { position: absolute; z-index: 1; left: 2.5%; bottom: 14%; padding: 12px 18px; background: #142635; border: 1px solid #7199b2; border-radius: 6px; font-size: 16px; }
@media (max-width: 900px) {
  .top h1, .top time, .caption strong { font-size: 17px; }
  .caption span, .art-note { font-size: 13px; }
  .dock button { font-size: 14px; padding: 0 8px; }
}
@media (max-width: 650px) and (orientation: portrait) {
  .shell { min-height: 540px; }
  .top, .dock { left: 4.2%; right: 4.2%; width: 91.6%; height: 9%; }
  .deck { top: 9%; right: 4.2%; bottom: 10%; left: 4.2%; }
  .home .map { top: 0; bottom: 40%; width: 100%; }
  .home .media, .home .phone { top: 62%; bottom: 0; width: 49%; }
  .home .media { left: 0; }
  .home .phone { left: 51%; }
  .home .media, .home .phone { grid-template-rows: 61% 39%; }
  .home .media .art, .home .phone .art { bottom: 39%; }
  .apps .card { width: 32%; }
  .apps .card:nth-child(3n+1) { left: 0; }
  .apps .card:nth-child(3n+2) { left: 34%; }
  .apps .card:nth-child(3n) { left: 68%; }
  .apps .card:nth-child(-n+3) { top: 0; bottom: 51%; }
  .apps .card:nth-child(n+4) { top: 51%; bottom: 0; }
  .dock > div { width: auto; }
}
</style>
<style>
.dock {
  display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(170px, .48fr);
  grid-template-rows: 1fr; align-items: stretch; gap: 8px; bottom: 1.5%; height: 10%;
  padding: 5px; border: 1px solid #415064; border-radius: 10px; background: #182330;
}
.dock > .dock-keys { display: flex; width: auto; gap: 3px; }
.dock button { font-size: clamp(13px, 1vw, 19px); }
.dock-keys button { display: flex; align-items: center; gap: 7px; padding: 0 clamp(8px, .85vw, 16px); }
.dock button:disabled { opacity: .42; cursor: default; }
.dock button:not(:disabled):hover { background: #2e4051; }
.dock .dock-status {
  display: flex; align-items: center; gap: 11px; min-width: 0; text-align: left; padding: 0 14px;
  background: #223444; color: #eff7ff; border-radius: 6px;
}
.dock .dock-media { background: #28323d; }
.dock-status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-status small { margin-left: auto; color: #b8cad9; white-space: nowrap; }
.glyph { width: 23px; height: 23px; flex: 0 0 23px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, .48fr); gap: 12px; height: 100%; }
.detail-main, .side { min-width: 0; background: #1b2938; border-radius: 12px; padding: clamp(18px, 2.4vw, 46px); }
.detail-main { display: flex; flex-direction: column; justify-content: space-between; }
.detail-main h2 { font-size: clamp(26px, 3vw, 50px); }
.detail-main p, .side p { color: #c5d0de; margin-top: 7px; }
.detail-main .art { position: relative; height: 48%; min-height: 95px; }
.detail-main .art > canvas { inset: 0; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-actions button, .side button { min-height: 44px; padding: 0 14px; border: 1px solid #62798b; border-radius: 6px; }
.detail-actions button[aria-pressed=true] { background: #d2e9f6; color: #132433; }
.deck { user-select: none; }
.deck.is-browsing { touch-action: none; }
button { touch-action: manipulation; }
.card-controls { position: absolute; bottom: 0; right: 12px; height: 28%; display: flex; align-items: center; gap: 7px; }
.card-controls button { position: relative; min-height: 44px; padding: 0 12px; border: 1px solid #62798b; border-radius: 6px; font-size: clamp(13px, 1vw, 18px); }
.card-controls button:hover, .detail-actions button:hover { background: #314456; }
.home .map .caption button { padding-right: 172px; }
.home .media .caption button { padding-right: 110px; }
.route-status { min-height: 1.4em; }
.side { background: #232d39; }
.side h2 { font-size: clamp(18px, 1.65vw, 30px); }
.side button { margin-top: 14px; }
@media (max-width: 850px) {
  .dock-status small, .key-label { display: none; }
  .dock { grid-template-columns: auto minmax(0, 1fr) minmax(100px, .65fr); }
  .dock-status .glyph { display: none; }
  .detail { grid-template-columns: minmax(0, 1fr) minmax(150px, .52fr); }
  .card-controls { right: 7px; gap: 4px; }
  .card-controls button { padding: 0 7px; }
  .home .media .caption button { padding-right: 72px; }
  .home .media .caption span { display: none; }
}
@media (max-width: 650px) and (orientation: portrait) {
  .dock { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: 1fr 1fr; height: 17%; bottom: 1%; }
  .dock > .dock-keys { grid-column: 1 / -1; justify-content: center; }
  .dock button { min-height: 36px; }
  .dock-status span { white-space: normal; line-height: 1.1; }
  .deck { bottom: 19%; }
  .detail { grid-template-columns: 1fr; grid-template-rows: minmax(0,1fr) auto; }
  .detail-main .art { min-height: 75px; }
  .detail-main, .side { padding: 12px; }
  .side button { margin-top: 8px; }
  .notice { bottom: 19%; max-width: 92%; }
  .card-controls { right: 6px; gap: 4px; }
  .card-controls button { padding: 0 7px; }
  .home .map .caption button { padding-right: 116px; }
  .home .media .caption button { padding-left: 8px; padding-right: 75px; }
  .home .media .caption span { display: none; }
  .home .media .card-controls { height: 39%; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><h1><b>K8</b> <span id="title">홈</span></h1><time id="clock"></time></header>
  <main class="deck" id="deck">
    <section id="home" class="row home" aria-label="홈">
      <article class="card map">
        <div class="art" id="map-slot"><canvas data-art="navi" aria-hidden="true"></canvas><p id="map-note" class="art-note">지도 미리보기 준비 중</p></div>
        <h2 class="caption"><button type="button" data-action="navi"><strong>내비게이션</strong><span>내비 화면 예시 열기</span></button></h2>
        <div class="card-controls" aria-label="지도 바로가기">
          <button type="button" data-destination="home">우리 집</button>
          <button type="button" data-destination="work">회사</button>
        </div>
      </article>
      <article class="card media">
        <div class="art"><canvas data-art="media" aria-hidden="true"></canvas></div>
        <h2 class="caption"><button type="button" data-action="media"><strong>미디어</strong><span>미디어 앱 열기</span></button></h2>
        <div class="card-controls"><button type="button" id="home-media-toggle">재생</button></div>
      </article>
      <article class="card phone">
        <div class="art"><canvas data-art="phone" aria-hidden="true"></canvas></div>
        <h2 class="caption"><button type="button" data-action="phone"><strong>전화</strong><span>전화 앱 열기</span></button></h2>
      </article>
    </section>
    <section id="apps" class="row apps" aria-label="전체 앱" hidden></section>
    <section id="detail" class="detail" aria-labelledby="detail-title" hidden>
      <article class="detail-main">
        <div><h2 id="detail-title"></h2><p id="detail-description"></p></div>
        <div class="art"><canvas data-art="navi" aria-hidden="true"></canvas></div>
        <div class="detail-actions" id="media-actions" hidden>
          <button type="button" id="media-toggle">재생</button>
        </div>
        <div id="route-actions" hidden>
          <div class="detail-actions" aria-label="지도 바로가기">
            <button type="button" data-destination="home" aria-pressed="false">우리 집</button>
            <button type="button" data-destination="work" aria-pressed="false">회사</button>
          </div>
          <p class="route-status" id="route-status" role="status"></p>
        </div>
      </article>
      <aside class="side" aria-label="분할 화면 예시">
        <h2 id="side-title">분할 화면</h2>
        <p id="side-text"></p>
        <button type="button" id="side-toggle">위젯 바꾸기</button>
      </aside>
    </section>
  </main>
  <footer class="dock" aria-label="하단 메뉴">
    <div class="dock-keys">
      <button type="button" id="back-button" aria-label="뒤로"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span class="key-label">뒤로</span></button>
      <button type="button" id="home-button" aria-pressed="true" aria-label="홈"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7v8H3z M10 19v-5h4v5"/></svg><span class="key-label">홈</span></button>
      <button type="button" id="apps-button" aria-pressed="false" aria-label="전체 앱"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span class="key-label">전체 앱</span></button>
    </div>
    <button type="button" class="dock-status" data-action="navi"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7.5 16-7.5-4-7.5 4z"/></svg><span>지도 연결 대기</span><small>내비게이션</small></button>
    <button type="button" class="dock-status dock-media" data-action="media" aria-label="미디어"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l9 6-9 6z"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg><span id="dock-media">미디어 꺼짐</span></button>
  </footer>
  <div id="notice" class="notice" role="status" hidden></div>
</div>
<script>
(function () {
  'use strict';
  var labels = { navi:'내비게이션',media:'미디어',phone:'전화',radio:'라디오',projection:'폰 프로젝션',settings:'설정' };
  var page = 'home';
  var home = document.getElementById('home');
  var apps = document.getElementById('apps');
  var detail = document.getElementById('detail');
  var history = [];
  var playing = false;
  var mediaStarted = false;
  var sideMedia = true;
  var notice = document.getElementById('notice');
  var timer;
  var gesture;
  var swiped = false;
  var swipeTimer;
  var touchButton;
  var destination;

  Object.keys(labels).forEach(function (key) {
    var tile = document.createElement('article');
    tile.className = 'card';
    tile.innerHTML = '<div class="art"><canvas data-art="' + key + '" aria-hidden="true"></canvas></div>' +
      '<h2 class="caption"><button type="button" data-action="' + key + '"><strong>' + labels[key] + '</strong></button></h2>';
    apps.appendChild(tile);
  });

  function drawIcon(ctx, name) {
    ctx.beginPath();
    if (name === 'navi') {
      ctx.moveTo(35,10); ctx.lineTo(55,58); ctx.lineTo(35,47); ctx.lineTo(15,58); ctx.closePath();
    } else if (name === 'media') {
      ctx.moveTo(47,12); ctx.lineTo(47,50); ctx.arc(38,50,9,0,Math.PI*2);
      ctx.moveTo(47,13); ctx.lineTo(59,22);
      ctx.moveTo(18,25); ctx.lineTo(35,25); ctx.moveTo(18,35); ctx.lineTo(31,35);
    } else if (name === 'phone') {
      ctx.moveTo(19,12); ctx.lineTo(29,25); ctx.lineTo(23,32); ctx.quadraticCurveTo(29,44,40,49);
      ctx.lineTo(47,43); ctx.lineTo(60,53); ctx.quadraticCurveTo(58,63,50,63);
      ctx.quadraticCurveTo(18,58,10,23); ctx.quadraticCurveTo(12,15,19,12); ctx.closePath();
    } else if (name === 'radio') {
      ctx.rect(9,24,52,31); ctx.moveTo(14,24); ctx.lineTo(50,12);
      ctx.moveTo(19,35); ctx.lineTo(42,35); ctx.moveTo(19,44); ctx.lineTo(36,44);
      ctx.moveTo(54,41); ctx.arc(49,41,5,0,Math.PI*2);
    } else if (name === 'projection') {
      ctx.rect(7,15,56,41); ctx.moveTo(25,35); ctx.lineTo(45,35);
      ctx.moveTo(37,27); ctx.lineTo(45,35); ctx.lineTo(37,43);
    } else {
      ctx.moveTo(12,20); ctx.lineTo(58,20); ctx.moveTo(12,35); ctx.lineTo(58,35);
      ctx.moveTo(12,50); ctx.lineTo(58,50);
      ctx.moveTo(26,13); ctx.lineTo(26,27); ctx.moveTo(44,28); ctx.lineTo(44,42);
      ctx.moveTo(21,43); ctx.lineTo(21,57);
    }
    ctx.stroke();
  }

  function paint() {
    var canvases = (page === 'home' ? home : page === 'apps' ? apps : detail).querySelectorAll('canvas');
    for (var i = 0; i < canvases.length; i++) {
      var canvas = canvases[i];
      var width = canvas.clientWidth;
      var height = canvas.clientHeight;
      var scale = Math.min(window.devicePixelRatio || 1, 2);
      if (!width || !height) continue;
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      var ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(201,230,246,.10)';
      ctx.beginPath(); ctx.moveTo(width * .52,0); ctx.lineTo(width,0);
      ctx.lineTo(width,height * .28); ctx.lineTo(width * .28,height); ctx.lineTo(0,height); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(8,16,27,.18)';
      ctx.beginPath(); ctx.moveTo(width, height * .36); ctx.lineTo(width,height);
      ctx.lineTo(width * .36,height); ctx.closePath(); ctx.fill();
      var size = Math.min(height * .45, width * .45, 110) / 70;
      ctx.translate((width - size * 70) / 2, (height - size * 70) / 2);
      ctx.scale(size, size);
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#d9edf5';
      drawIcon(ctx, canvas.getAttribute('data-art'));
    }
  }

  function updateStatus() {
    var mediaState = playing ? '미디어 재생 중 · 예시' : mediaStarted ? '미디어 일시정지 · 예시' : '미디어 꺼짐';
    document.getElementById('dock-media').textContent = mediaState;
    var mediaAction = playing ? '일시정지' : '재생';
    document.getElementById('media-toggle').textContent = mediaAction;
    document.getElementById('home-media-toggle').textContent = mediaAction;
    document.getElementById('side-title').textContent = sideMedia ? '미디어 위젯' : '내비 위젯';
    document.getElementById('side-text').textContent = sideMedia ? mediaState : '지도 연결 대기';
    var routeButtons = document.querySelectorAll('#route-actions [data-destination]');
    for (var i = 0; i < routeButtons.length; i++) {
      routeButtons[i].setAttribute('aria-pressed', String(routeButtons[i].getAttribute('data-destination') === destination));
    }
    document.getElementById('route-status').textContent = destination ?
      (destination === 'home' ? '우리 집' : '회사') + ' 선택됨 · 길 안내 예시' : '';
  }

  function show(next) {
    page = next;
    document.getElementById('deck').classList.toggle('is-browsing', next === 'home' || next === 'apps');
    home.hidden = next !== 'home';
    apps.hidden = next !== 'apps';
    detail.hidden = next === 'home' || next === 'apps';
    var title = next === 'home' ? '홈' : next === 'apps' ? '전체 앱' : labels[next];
    document.getElementById('title').textContent = title;
    if (!detail.hidden) {
      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-description').textContent = {
        navi:'순정 지도 연결을 기다리고 있습니다.',
        media:'예시 재생 상태가 홈과 하단 미디어에 함께 표시됩니다.',
        phone:'차량 연결과 최근 통화 정보를 표시할 자리입니다.'
      }[next];
      detail.querySelector('canvas').setAttribute('data-art', next);
      document.getElementById('media-actions').hidden = next !== 'media';
      document.getElementById('route-actions').hidden = next !== 'navi';
      sideMedia = next !== 'media';
    }
    notice.hidden = true;
    document.getElementById('back-button').disabled = !history.length;
    document.getElementById('home-button').setAttribute('aria-pressed', next === 'home' ? 'true' : 'false');
    document.getElementById('apps-button').setAttribute('aria-pressed', next === 'apps' ? 'true' : 'false');
    updateStatus();
    paint();
  }

  function open(next) {
    if (page === next) return;
    history.push(page);
    show(next);
  }
  function goHome() {
    history.length = 0;
    show('home');
  }
  document.getElementById('home-button').onclick = goHome;
  document.getElementById('apps-button').onclick = function () { open('apps'); };
  document.getElementById('back-button').onclick = function () {
    if (history.length) show(history.pop());
  };
  function toggleMedia() { mediaStarted = true; playing = !playing; updateStatus(); }
  document.getElementById('media-toggle').onclick = toggleMedia;
  document.getElementById('home-media-toggle').onclick = toggleMedia;
  Array.prototype.forEach.call(document.querySelectorAll('[data-destination]'), function (button) {
    button.onclick = function () {
      destination = button.getAttribute('data-destination');
      open('navi');
      updateStatus();
    };
  });
  document.getElementById('side-toggle').onclick = function () { sideMedia = !sideMedia; updateStatus(); };
  document.addEventListener('click', function (event) {
    var action = event.target;
    while (action && !action.hasAttribute('data-action')) action = action.parentElement;
    if (!action) return;
    var name = action.getAttribute('data-action');
    if (name === 'navi' || name === 'media' || name === 'phone') {
      open(name);
      return;
    }
    notice.textContent = labels[name] + ' 바로가기 · 차량에서 연결할 항목';
    notice.hidden = false;
    window.clearTimeout(timer);
    timer = window.setTimeout(function () { notice.hidden = true; }, 2400);
  });

  var deck = document.getElementById('deck');
  document.addEventListener('pointerdown', function (event) {
    window.clearTimeout(swipeTimer);
    swiped = false;
    touchButton = null;
    if (!event.isPrimary || event.button !== 0) return;
    var inDeck = deck.contains(event.target);
    var button = event.target.closest('button');
    var canSwipe = inDeck && (page === 'home' || page === 'apps');
    if (!canSwipe && (!button || event.pointerType !== 'touch')) return;
    gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, button: button, canSwipe: canSwipe };
  });
  window.addEventListener('pointerup', function (event) {
    if (!gesture || gesture.id !== event.pointerId) return;
    var start = gesture;
    gesture = null;
    var dx = event.clientX - start.x;
    var dy = event.clientY - start.y;
    if (event.pointerType === 'touch' && start.button && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      var hit = document.elementFromPoint(event.clientX, event.clientY);
      if (hit && hit.closest('button') === start.button && !start.button.disabled) {
        touchButton = start.button;
        start.button.click();
      }
      return;
    }
    if (!start.canSwipe || Math.abs(dx) < 45 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
    swiped = true;
    if (dx < 0) open('apps');
    else goHome();
    swipeTimer = window.setTimeout(function () { swiped = false; }, 350);
  });
  window.addEventListener('pointercancel', function () { gesture = null; });
  document.addEventListener('click', function (event) {
    var repeatedTouch = touchButton && event.isTrusted && event.detail > 0 && event.target.closest('button') === touchButton;
    if (!repeatedTouch && !(swiped && deck.contains(event.target))) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);
  window.addEventListener('resize', paint);
  function tick() {
    var now = new Date();
    document.getElementById('clock').textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  }
  tick();
  window.setInterval(tick, 1000);
  show('home');
}());
</script>
</body>
